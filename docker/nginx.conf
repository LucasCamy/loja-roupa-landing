server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # nginx:stable-alpine já mapeia webp; garante avif
  types {
    image/avif avif;
  }
  include /etc/nginx/mime.types;

  # add_header dentro de um location anula os do server: include repetido em cada bloco
  include /etc/nginx/snippets/security-headers.conf;

  # Arquivos com hash no nome
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Mídia versionada por ?v=<hash>
  location /media/ {
    add_header Cache-Control "public, max-age=2592000, no-transform";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # HTML sempre revalidado
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
